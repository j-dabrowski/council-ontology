name: Maintenance

# The maintenance run (docs/AGENT_DESIGN.md §5, docs/AUTOMATION_ARCHITECTURE.md):
# council draft -> S7 invariant gate (inside council draft) -> Editor/Fixer
# loop (scripts/conductor_loop.py) -> council editor-score (two-layer
# scoring, docs/GENERATION_SCORING_SPLIT.md §2.3/§2.4 — runs once per
# chain regardless of PASS or escalation) -> optionally council publish.
#
# Built on the staging escalation model (AUTOMATION_ARCHITECTURE.md Part
# 4): one workflow run here is one SEGMENT of a logical run. It always
# branches off the shared `staging` lane and always ends in exactly one
# PR — to `main` if the segment completed cleanly, to `staging` if it
# escalated (a cap-hit, a Fixer BLOCKED report, an Editor human-track
# flag, or a hard editor-score finding). Merging an escalation PR is the
# approval that resumes the run — .github/workflows/resume.yml watches
# for that merge and auto-dispatches the next segment. See that doc's
# Part 4 for the full model and CICD_DECISIONS.md's 2026-08-24 entries
# for what was rejected along the way.
#
# Deliberately does NOT include the DB-update pipeline (scrape/extract/
# dedup — AUTOMATION_ARCHITECTURE.md Flow 0) or Renderer. Both remain
# design sketches, not wired here — see that doc's Part 2 table and this
# workflow's own activation checklist below for why.
#
# publish=true is an explicit opt-in, off by default: the design's own
# precondition for autonomous publish (docs/AGENT_DESIGN.md §5, "Editor's
# narrowed scope has calibration data") is not yet met — Editor v0.4 has
# never completed a real PASS/FAIL cycle as of this workflow's creation
# (2026-08-23). Setting publish=true before that data exists is a conscious
# override, not the safe default; the workflow does not refuse it (a human
# dispatching this by hand is a deliberate act either way), but it never
# happens on its own. council publish's own commit is deliberately kept
# OFF the segment branch — see the "Publish" step below for why.
#
# --- Scheduling: commented out on purpose. Uncomment only once ALL of the
# activation checklist below is true. Flipping this is a one-line PR, not
# a rebuild — see AUTOMATION_ARCHITECTURE.md Part 3 (Flow D) for the fuller
# reasoning and who signs off.
#
# Activation checklist (all required, tracked in EDITOR_PROTOCOL.md's
# calibration log — do not uncomment until every box is literally checked
# there, not just believed true):
#   [ ] >= 3 real Editor v0.4 PASS/FAIL cycles have completed via this
#       workflow (workflow_dispatch), reviewed by a human against this
#       repo's own judgment of the same draft
#   [ ] Editor's false-positive dimension (EDITOR_PROTOCOL.md, added
#       2026-08-23) has real data, not just the pre-narrowing prediction
#   [ ] zero missed real risks (false negatives) across those cycles —
#       the one failure mode that matters, per EDITOR_PROTOCOL.md
#   [ ] a human (the project owner) has explicitly signed off on the
#       calibration data in a PR that uncomments the schedule block
#
# on:
#   schedule:
#     - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC — placeholder cadence,
#                          # revisit once real run duration/cost is known
on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Auto-publish on a clean, non-escalated segment (council publish
          --gate-profile auto). Default false — see this file's header
          comment for why this isn't the safe default yet. A deliberate
          per-dispatch override, not a setting to leave on.
        required: false
        type: boolean
        default: false
      mode:
        description: >-
          fresh: reset the shared `staging` lane to `main` and start a new
          logical run at segment 1. resume: keep `staging` (which holds
          any segment(s) already approved by merging an escalation PR),
          merge `main` into it first, and continue from
          .github/run_state.json at `staging` HEAD. Only .github/workflows/
          resume.yml should normally choose resume — a human re-dispatching
          by hand almost always wants fresh unless deliberately continuing
          a declined-and-not-yet-retried run. See
          docs/AUTOMATION_ARCHITECTURE.md Part 4.
        required: false
        type: choice
        options: [fresh, resume]
        default: fresh

permissions:
  contents: write   # segment commits + publish's direct commit to main
  pull-requests: write   # the segment PR (to main or to staging)
  id-token: write    # required to mint the OIDC token that authenticates to GCP

concurrency:
  # Shared with discovery.yml (and the segments resume.yml dispatches) —
  # `staging` is one lane for the whole repo, not one per workflow file
  # (AUTOMATION_ARCHITECTURE.md Part 4: "staging is a single lane"). A
  # second dispatch while one is in flight queues rather than cancels —
  # cancelling mid-run would abandon a segment's draft/review work.
  group: council-ontology-staging-lane
  cancel-in-progress: false

jobs:
  maintenance:
    name: Draft, review, and (optionally) publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need real history on both main and staging to merge/push either

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - id: auth
        name: Authenticate to GCP (OIDC, no long-lived key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download council.db from GCS
        run: |
          mkdir -p data
          gcloud storage cp "gs://${{ vars.GCP_BUCKET }}/council.db" data/council.db

      - name: Prepare the staging lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.mode }}" = "fresh" ]; then
            echo "fresh dispatch: resetting staging = main"
            git fetch origin main
            git push origin origin/main:refs/heads/staging --force
          else
            echo "resume dispatch: merging main into the existing staging lane"
            git fetch origin staging
            git checkout -B staging origin/staging
            # Deliberately unconditional (Part 4's fix-placement rule): a
            # no-op when main hasn't moved, carries an instrument fix when
            # it has. A real conflict here is rare and is itself a signal
            # worth a human's look -- this step fails loudly rather than
            # attempting to resolve it.
            git merge origin/main --no-edit -m "Merge main into staging (resume, run ${{ github.run_id }})"
            git push origin staging
          fi
          git fetch origin staging

      - name: Determine this segment's number and create its working branch
        id: segment
        run: |
          n=$(python scripts/run_state.py next-segment --mode "${{ inputs.mode }}")
          branch="working_session_${n}"
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch" origin/staging

      - name: Run the draft -> Editor -> Fixer loop
        id: loop
        run: |
          set +e
          python scripts/conductor_loop.py cambridge
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 (PASS) and 1 (escalation) are both normal loop outcomes this
          # segment's PR routes to a human, not infra failures — only
          # anything else (2 = genuine script error; anything unexpected)
          # should turn this step, and the job, red. See the "Fail the
          # job..." step below for where 2 actually gets enforced; this
          # step itself always exits 0 so later steps can inspect the
          # real code via steps.loop.outputs.exit_code.
          exit 0
        env:
          # Subscription auth only — never ANTHROPIC_API_KEY. See
          # scripts/conductor_loop.py's own docstring ("Billing") and
          # docs/AGENT_PROMPTS.md's GitHub Actions section for why.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Locate the final draft directory
        id: draft
        if: steps.loop.outputs.exit_code == '0' || steps.loop.outputs.exit_code == '1'
        run: |
          # conductor_loop.py may re-draft several times (one per pass);
          # the last one created is the one whose verdict decided the
          # loop's outcome. Same glob-not-parse-stdout approach draft.yml
          # already uses.
          draft_dir=$(ls -dt data/draft/cambridge/*/ | head -1)
          echo "path=${draft_dir%/}" >> "$GITHUB_OUTPUT"
          echo "run_id=$(basename "${draft_dir%/}")" >> "$GITHUB_OUTPUT"

      - name: Upload the final draft to GCS (for the record, every outcome)
        if: steps.draft.outputs.path != ''
        run: |
          gcloud storage cp -r "${{ steps.draft.outputs.path }}" "gs://${{ vars.GCP_BUCKET }}/drafts/cambridge/"

      - name: Score the Editor review (two layers, docs/GENERATION_SCORING_SPLIT.md §2.3)
        id: score
        # Runs once per chain regardless of PASS or escalation -- its
        # purpose is calibration, not gating (§2.4), but a hard finding
        # here (exit 1) is now ALSO one of this segment's escalation
        # triggers (Part 4 lists "a scoring-stage hard finding" as an
        # escalation type in its own right). Only skipped if the loop
        # never reached an Editor review at all. always(): still run this
        # even if the GCS upload step immediately above failed (e.g. a
        # transient network error) — scoring doesn't depend on that
        # upload having succeeded.
        if: always() && steps.draft.outputs.path != ''
        run: |
          set +e
          council editor-score cambridge "${{ steps.draft.outputs.run_id }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Upload the score to GCS (for the record, every outcome)
        if: always() && steps.score.outputs.exit_code != ''
        run: |
          gcloud storage cp -r "${{ steps.draft.outputs.path }}" "gs://${{ vars.GCP_BUCKET }}/drafts/cambridge/"

      - name: Determine whether this segment escalates
        id: escalate
        # always(): a failed GCS upload above is a for-the-record
        # convenience, not a reason to skip the escalation/PR chain.
        if: always() && (steps.loop.outputs.exit_code == '0' || steps.loop.outputs.exit_code == '1')
        run: |
          if [ "${{ steps.loop.outputs.exit_code }}" = "1" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "reason=conductor_escalation (cap-hit, Fixer BLOCKED, or an Editor human-track flag — see the loop step's log)" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.score.outputs.exit_code }}" = "1" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "reason=score_hard_finding (editor-score found a Layer-1 structural problem or a Layer-2 false negative)" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether Fixer touched anything outside frontend/public/data
        id: fixer
        if: always() && (steps.loop.outputs.exit_code == '0' || steps.loop.outputs.exit_code == '1')
        run: |
          # Excludes frontend/public/data (publish's own output, not a
          # Fixer repair) and .github/run_state.json (written by this
          # workflow itself below, not by Fixer) — anything else dirty
          # here is a real source/prompt/doc edit Fixer made while closing
          # an Editor flag, and per AUTOMATION_ARCHITECTURE.md Part 3's
          # uniform rule it must reach a human before publishing proceeds.
          if git status --porcelain -- . ':!frontend/public/data' ':!.github/run_state.json' | grep -q .; then
            echo "touched_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched_source=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (only if this segment didn't escalate, publish=true, Fixer touched nothing, and the score is clean)
        id: publish
        # The four conditions: escalating means this isn't a reviewed-clean
        # result yet. Fixer having touched source means a fix is sitting in
        # this segment's own not-yet-merged PR, so publishing now would ship
        # refreshed data against the unfixed code Editor flagged — publish
        # by hand once that PR merges (the job summary prints the command).
        # The score condition (docs/GENERATION_SCORING_SPLIT.md §2.4) is
        # folded into "escalate" above, restated here for clarity.
        if: >-
          steps.loop.outputs.exit_code == '0' &&
          steps.escalate.outputs.value == 'false' &&
          inputs.publish == true &&
          steps.fixer.outputs.touched_source != 'true' &&
          steps.score.outputs.exit_code == '0'
        run: |
          council publish cambridge \
            --from-draft "${{ steps.draft.outputs.path }}" \
            --gate-profile auto

          # Isolated from this segment's own branch on purpose: under the
          # staging model, working_session_N can already carry commits
          # from a prior approved-but-unmerged segment (a resume dispatch)
          # -- committing HEAD straight to main here would push that whole
          # segment history, including anything not yet reviewed via its
          # own PR, defeating the PR gate this model exists to enforce
          # (docs/CICD_DECISIONS.md's entry logging this build). Safe to
          # discard the segment branch's working-tree state below because
          # this step only runs when steps.fixer found nothing uncommitted
          # outside frontend/public/data -- there is nothing else to lose.
          rm -rf /tmp/published-data
          cp -r frontend/public/data /tmp/published-data
          git checkout -- frontend/public/data
          git clean -fd -- frontend/public/data

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-tmp origin/main
          rm -rf frontend/public/data
          cp -r /tmp/published-data frontend/public/data
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "No change in published snapshots — nothing to commit."
          else
            git commit -m "Publish refreshed snapshots (maintenance workflow, run ${{ github.run_id }})"
            # main may have moved since the fetch above (a long loop run
            # can take minutes). Rebase before pushing: a rejected push
            # here would fail the job after council publish already ran,
            # losing the record of a publish that actually happened.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git checkout "${{ steps.segment.outputs.branch }}"

      - name: Write run_state.json and open this segment's PR
        id: segment_pr
        # always(): the Publish step immediately above can itself fail
        # (e.g. council publish erroring) without that being a reason to
        # also drop this segment's PR — a publish failure should turn the
        # job red (it isn't swallowed; nothing here uses
        # continue-on-error), but the segment's own record still belongs
        # in a PR, same as if publish had simply been skipped.
        if: always() && (steps.loop.outputs.exit_code == '0' || steps.loop.outputs.exit_code == '1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          status="completed"
          if [ "${{ steps.escalate.outputs.value }}" = "true" ]; then
            status="escalated"
          fi

          reason_args=()
          if [ -n "${{ steps.escalate.outputs.reason }}" ]; then
            reason_args=(--escalation-reason "${{ steps.escalate.outputs.reason }}")
          fi
          publish_args=()
          if [ "${{ inputs.publish }}" = "true" ]; then
            publish_args=(--publish-requested)
          fi

          python scripts/run_state.py write \
            --run-id "maintenance-${{ github.run_id }}" \
            --workflow maintenance \
            --council cambridge \
            --segment "${{ steps.segment.outputs.number }}" \
            --mode "${{ inputs.mode }}" \
            --status "$status" \
            "${reason_args[@]}" \
            --conductor-loop-json "{\"exit_code\": ${{ steps.loop.outputs.exit_code }}}" \
            "${publish_args[@]}"

          # Everything except frontend/public/data: that's publish's own
          # output (committed directly to main above, when it ran at all),
          # never part of a segment PR.
          git add -A -- . ':!frontend/public/data'
          changed=$(git diff --cached --name-only)
          git commit -m "Segment ${{ steps.segment.outputs.number }} of maintenance run ${{ github.run_id }} ($status)"
          git push -u origin "${{ steps.segment.outputs.branch }}"

          target="main"
          if [ "$status" = "escalated" ]; then
            target="staging"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

          escalation_note=""
          if [ "$status" = "escalated" ]; then
            escalation_note="**Escalation reason:** ${{ steps.escalate.outputs.reason }}. Merging this PR into \`staging\` is the approval that resumes this logical run — see docs/AUTOMATION_ARCHITECTURE.md Part 4."
          fi

          pr_body=$(cat <<EOF
          Segment ${{ steps.segment.outputs.number }} of maintenance run ${{ github.run_id }} (\`mode=${{ inputs.mode }}\`), status: **$status**.

          **Files changed:**
          \`\`\`
          $changed
          \`\`\`

          Draft: \`gs://${{ vars.GCP_BUCKET }}/drafts/cambridge/${{ steps.draft.outputs.run_id }}/\`

          $escalation_note

          This summary deliberately never restates risk-bearing prose about named individuals — the diff and the draft carry the specifics.
          EOF
          )
          gh pr create --base "$target" \
            --title "Maintenance segment ${{ steps.segment.outputs.number }} ($status) — run ${{ github.run_id }}" \
            --body "$pr_body"
          echo "opened=true" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Maintenance run — cambridge (segment ${{ steps.segment.outputs.number }}, mode=${{ inputs.mode }})"
            echo ""
            echo "Draft: \`gs://${{ vars.GCP_BUCKET }}/drafts/cambridge/${{ steps.draft.outputs.run_id }}/\`"
            echo ""
            if [ -n "${{ steps.score.outputs.exit_code }}" ]; then
              if [ "${{ steps.score.outputs.exit_code }}" = "0" ]; then
                echo "Editor score: **clean** (both layers passed)."
              else
                echo "Editor score: **FAIL** — a Layer-1 structural problem, or a Layer-2"
                echo "false negative (a real risk the review missed). See"
                echo "\`editor_score_<n>.md\` in the draft directory. This is now one of"
                echo "this segment's own escalation triggers."
              fi
              echo ""
            fi
            if [ "${{ steps.segment_pr.outputs.opened }}" = "true" ]; then
              echo "**Segment PR opened, targeting \`${{ steps.segment_pr.outputs.target }}\`.**"
              if [ "${{ steps.segment_pr.outputs.target }}" = "staging" ]; then
                echo ""
                echo "This segment escalated. Approve + merge that PR (amending it first if"
                echo "you can fix the issue directly) to resume the run — see"
                echo ".github/workflows/resume.yml, which auto-dispatches the next segment"
                echo "on that merge. Closing it instead ends this logical run; the approved"
                echo "segments already in \`staging\` are kept for a later resume dispatch."
              elif [ "${{ steps.fixer.outputs.touched_source }}" = "true" ]; then
                echo ""
                echo "Fixer changed source to close Editor flags — publishing is held until"
                echo "this PR merges to \`main\`, so refreshed data never ships against the"
                echo "code the Editor flagged. Publish by hand once it merges:"
                echo '```'
                echo "council publish cambridge --from-draft ${{ steps.draft.outputs.path }} --gate-profile auto"
                echo '```'
              elif [ "${{ steps.publish.outcome }}" != "success" ]; then
                echo ""
                echo "Not published (publish=false, or held on the Editor score above)."
                echo "Publish by hand with:"
                echo '```'
                echo "council publish cambridge --from-draft ${{ steps.draft.outputs.path }} --gate-profile auto"
                echo "# or, to vouch for it yourself instead of trusting Editor's auto record:"
                echo "council publish cambridge --from-draft ${{ steps.draft.outputs.path }} --confirm \"<reviewer note>\""
                echo '```'
              else
                echo ""
                echo "**Loop PASSED — publish step ran (see the Publish step above for the result).**"
              fi
            elif [ "${{ steps.loop.outputs.exit_code }}" != "0" ] && [ "${{ steps.loop.outputs.exit_code }}" != "1" ]; then
              echo "**Loop errored (exit ${{ steps.loop.outputs.exit_code }})** — a genuine"
              echo "script/subprocess failure, not a normal escalation. See the loop step's"
              echo "log. This job is marked failed. No segment PR was opened."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if the loop errored (not just escalated)
        if: steps.loop.outputs.exit_code != '0' && steps.loop.outputs.exit_code != '1'
        run: |
          echo "conductor_loop.py exited ${{ steps.loop.outputs.exit_code }} — not a normal"
          echo "PASS (0) or escalation (1). Treating this as a real failure."
          exit 1
