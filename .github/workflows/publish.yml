name: Publish

# The publish gate: copies a *reviewed* draft's public-tier snapshots into
# frontend/public/data/ and commits them. This is stage three of the
# draft → review → publish flow (see docs/TESTING.md "Draft & publish
# workflow") — stage one is draft.yml, stage two is the investigator +
# defamation-auditor review that happens on the draft output in between,
# outside of CI.
#
# The gate itself lives in the CLI, not this workflow: `council publish`
# refuses to run without draft_gcs_path, plus one of two authorization paths
# selected by gate_profile — see src/publish_gate.py and docs/review/
# CONDUCTOR.md's "Gate profiles" section. This workflow can't route around
# that; it's a thin wrapper the same way every other pipeline workflow in
# this repo is.
#
# gate_profile: interactive (default) requires confirm_note, a human's own
# note. auto requires no confirm_note — council publish instead re-validates
# a defamation_review_<n>.json PASS record already inside the draft
# directory. Operational caveat: draft.yml uploads its draft to GCS *before*
# review happens, so for auto to work through this workflow, whoever ran
# Editor locally must re-upload the augmented draft dir (including the JSON
# sidecar) to the same GCS path before triggering this workflow in auto
# mode. Full round-tripping through CI (Editor running as a CI step too) is
# a later-phase concern, not solved here.
#
# Doesn't need council.db at all — `council publish` only ever copies bytes
# out of the draft directory, never recomputes from the database, so what
# was reviewed is exactly what ships even if the DB has since changed.
#
# Manually triggered, deliberately not on a schedule: publishing reflects a
# deliberate, reviewed decision, not the passage of time. Trigger with:
#   gh workflow run publish.yml -f draft_gcs_path=drafts/cambridge/<run_id> -f confirm_note="<reviewer note>"
# or, in auto gate profile:
#   gh workflow run publish.yml -f draft_gcs_path=drafts/cambridge/<run_id> -f gate_profile=auto
#
# Auth to GCP is via workload identity federation (OIDC) — no service
# account key is stored anywhere. GCP_WORKLOAD_IDENTITY_PROVIDER,
# GCP_SERVICE_ACCOUNT and GCP_BUCKET are repo Variables, not Secrets —
# knowing them grants nothing; access is only possible from a workflow run
# whose OIDC token matches the attribute condition set up in GCP (this
# exact repo).
on:
  workflow_dispatch:
    inputs:
      draft_gcs_path:
        description: >-
          GCS path (under the bucket) to the reviewed draft, e.g.
          drafts/cambridge/draft_20260805_120000 — printed by draft.yml's
          job summary.
        required: true
        type: string
      gate_profile:
        description: >-
          interactive (default): requires confirm_note below. auto:
          requires no confirm_note — re-validates an Editor PASS record
          already in the draft directory instead. See
          docs/review/CONDUCTOR.md's "Gate profiles" section.
        required: false
        type: choice
        default: interactive
        options:
          - interactive
          - auto
      confirm_note:
        description: >-
          Explicit confirmation that this draft has been reviewed (reviewer
          name + date + summary). Required when gate_profile is interactive
          (the default); ignored when gate_profile is auto. There is no
          default-approve in interactive mode — see src/publish_gate.py.
        required: false
        type: string

permissions:
  contents: write
  id-token: write   # required to mint the OIDC token that authenticates to GCP

jobs:
  publish:
    name: Publish a reviewed draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - id: auth
        name: Authenticate to GCP (OIDC, no long-lived key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download the reviewed draft from GCS
        run: |
          mkdir -p data/draft/cambridge
          gcloud storage cp -r "gs://${{ vars.GCP_BUCKET }}/${{ inputs.draft_gcs_path }}" data/draft/cambridge/

      - name: Run council publish
        run: |
          run_id=$(basename "${{ inputs.draft_gcs_path }}")
          gate_profile="${{ inputs.gate_profile || 'interactive' }}"
          if [ "$gate_profile" = "auto" ]; then
            council publish cambridge \
              --from-draft "data/draft/cambridge/${run_id}" \
              --gate-profile auto
          else
            council publish cambridge \
              --from-draft "data/draft/cambridge/${run_id}" \
              --gate-profile interactive \
              --confirm "${{ inputs.confirm_note }}"
          fi

      - name: Archive full-tier output to GCS (private — no public serving layer yet)
        run: |
          full_dir="data/published_full/cambridge"
          if [ -d "$full_dir" ] && [ -n "$(find "$full_dir" -mindepth 1 -maxdepth 1)" ]; then
            gcloud storage cp -r "$full_dir"/* "gs://${{ vars.GCP_BUCKET }}/published/full/cambridge/"
          else
            echo "No full-tier output this run — nothing to archive."
          fi

      - name: Commit refreshed public-tier snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "No change in published snapshots — nothing to commit."
            exit 0
          fi
          git commit -m "Publish refreshed snapshots (workflow_dispatch, run ${{ github.run_id }})"
          git push
