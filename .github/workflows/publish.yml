name: Publish

# ⚠ DO NOT RUN AGAINST REAL DATA YET. This workflow has no defamation-review
# gate between "generate JSON" and "commit it to a public repo." See the
# "Known gap" section in docs/TESTING.md before triggering this for real —
# frontend/public/data/ is deliberately still gitignored pending review.
#
# Manually triggered, deliberately not on a schedule: publishing reflects a
# finished extraction/investigation pass, not the passage of time. Trigger
# with: gh workflow run publish.yml
#
# Prerequisite: data/council.db must be uploaded to the private GCS bucket
# (see docs/TESTING.md for the one-time GCP setup and the upload command).
# Auth to GCP is via workload identity federation (OIDC) — no service
# account key is stored anywhere. GCP_WORKLOAD_IDENTITY_PROVIDER,
# GCP_SERVICE_ACCOUNT and GCP_BUCKET are repo Variables, not Secrets —
# knowing them grants nothing; access is only possible from a workflow run
# whose OIDC token matches the attribute condition set up in GCP (this
# exact repo).
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # required to mint the OIDC token that authenticates to GCP

jobs:
  publish:
    name: Publish snapshots from council.db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - id: auth
        name: Authenticate to GCP (OIDC, no long-lived key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download council.db from GCS
        run: |
          mkdir -p data
          gcloud storage cp "gs://${{ vars.GCP_BUCKET }}/council.db" data/council.db

      - name: Run council publish
        run: council publish cambridge

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "No change in published snapshots — nothing to commit."
            exit 0
          fi
          git commit -m "Publish refreshed snapshots (workflow_dispatch, run ${{ github.run_id }})"
          git push
