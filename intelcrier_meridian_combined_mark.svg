<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A combined mark: a brass globe with a vertical meridian line, crowned at its apex point by three radiating arcs representing the crier's call. Shown large on ink, reversed on parchment, and in a horizontal lockup with the Intelcrier wordmark.</desc>

