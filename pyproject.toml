[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "council-ontology"
version = "0.1.0"
description = "Model local council politics in Perth, Australia via structured extraction from public meeting minutes"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "cryptography>=3.1",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "rich>=13.0",
    "json-repair>=0.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ipykernel>=6.0",
    "ruff>=0.6",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
council = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "E7"]
